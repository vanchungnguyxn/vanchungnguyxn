name: Update Metrics

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-metrics.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render metric SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: node scripts/render-metrics.js

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics
          if git diff --cached --quiet; then
            echo "No metric changes"
          else
            git commit -m "chore: refresh profile metrics"
            git push
          fi
