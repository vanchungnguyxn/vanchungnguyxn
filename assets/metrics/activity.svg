<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-label="Activity Pulse">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162033" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e5eefc; }
      .label { font: 500 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b9bb4; }
      .value { font: 700 22px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e5eefc; }
      .small { font: 500 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b9bb4; }
      .accent { fill: #2dd4bf; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      .barGrow { animation: grow .9s ease-out both; }
      @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    </style>
  </defs>
  <rect width="400" height="260" rx="14" fill="url(#bgGrad)" stroke="#1f2a3d" stroke-width="1"/>
  <rect width="400" height="260" rx="14" fill="url(#grid)" opacity=".35"/>
  <rect x="0" y="0" width="6" height="260" rx="3" fill="url(#accentGrad)"/>
  <circle cx="382" cy="18" r="4" class="pulse" fill="#2dd4bf"/>
  <text x="22" y="28" class="title">Activity Pulse</text>
  
      <text x="22" y="52" class="label">Commits this year</text>
      <text x="378" y="52" class="value" style="font-size:16px" text-anchor="end" fill="#2dd4bf">107</text>
      <line x1="22" y1="62" x2="378" y2="62" stroke="#1f2a3d" stroke-width="1" opacity=".7"/>
      <text x="22" y="82" class="label">Pull requests</text>
      <text x="378" y="82" class="value" style="font-size:16px" text-anchor="end" fill="#2dd4bf">6</text>
      <line x1="22" y1="92" x2="378" y2="92" stroke="#1f2a3d" stroke-width="1" opacity=".7"/>
      <text x="22" y="112" class="label">Issues opened</text>
      <text x="378" y="112" class="value" style="font-size:16px" text-anchor="end" fill="#2dd4bf">0</text>
      <line x1="22" y1="122" x2="378" y2="122" stroke="#1f2a3d" stroke-width="1" opacity=".7"/>
      <text x="22" y="142" class="label">Code reviews</text>
      <text x="378" y="142" class="value" style="font-size:16px" text-anchor="end" fill="#2dd4bf">0</text>
      <line x1="22" y1="152" x2="378" y2="152" stroke="#1f2a3d" stroke-width="1" opacity=".7"/>
      <text x="22" y="172" class="label">Total contributions</text>
      <text x="378" y="172" class="value" style="font-size:16px" text-anchor="end" fill="#2dd4bf">222</text>
      <line x1="22" y1="182" x2="378" y2="182" stroke="#1f2a3d" stroke-width="1" opacity=".7"/>
      <text x="22" y="202" class="label">Merged PRs (all time)</text>
      <text x="378" y="202" class="value" style="font-size:16px" text-anchor="end" fill="#2dd4bf">9</text>
      <line x1="22" y1="212" x2="378" y2="212" stroke="#1f2a3d" stroke-width="1" opacity=".7"/>
</svg>